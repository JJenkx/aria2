name: release

# Build static release binaries for Windows (mingw), Android and macOS,
# generate SLSA build-provenance attestations for every artifact, and (on a
# tag push) attach them to a GitHub Release.
#
# Triggers:
#   * push a tag matching release-* or v*  -> builds that tag and publishes a release
#   * manual "Run workflow" (workflow_dispatch) -> builds the selected branch/tag,
#     uploads artifacts + attestations but does NOT create a release
#
# The Windows and Android jobs cross-compile inside Docker on Linux runners and
# build THIS repository (github.repository) at the triggering ref, so forks build
# their own code. macOS uses the repo's makerelease-osx.mk (static deps + AppleTLS).

on:
  push:
    tags:
      - 'release-*'
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write      # create releases / upload assets
  id-token: write      # required by attest-build-provenance
  attestations: write  # write the provenance attestations

jobs:
  windows:
    name: windows (${{ matrix.label }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: i686-w64-mingw32
            label: win-32bit
          - host: x86_64-w64-mingw32
            label: win-64bit
    steps:
      - uses: actions/checkout@v4

      - name: Build (Docker, static mingw)
        run: |
          docker build \
            --build-arg ARIA2_REPO=${{ github.repository }} \
            --build-arg ARIA2_VERSION=${{ github.ref_name }} \
            --build-arg ARIA2_REF=${{ github.ref }} \
            --build-arg HOST=${{ matrix.host }} \
            -t aria2-mingw-${{ matrix.host }} - < Dockerfile.mingw
          mkdir -p out
          docker run --rm -v "$PWD/out:/out" aria2-mingw-${{ matrix.host }} \
            cp /aria2/src/aria2c.exe /out

      - name: Package
        id: pkg
        run: |
          VERSION=$(sed -n 's/^AC_INIT(\[aria2\],\[\([^]]*\)\].*/\1/p' configure.ac)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          DIST="aria2-$VERSION-${{ matrix.label }}-build1"
          mkdir -p "dist/$DIST"
          cp out/aria2c.exe "dist/$DIST/"
          cp AUTHORS COPYING LICENSE.OpenSSL NEWS README.mingw "dist/$DIST/"
          (cd dist && zip -9 -r "$DIST.zip" "$DIST" && rm -rf "$DIST")
          echo "asset=dist/$DIST.zip" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.pkg.outputs.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: dist/*.zip

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes 2>/dev/null || true
          gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber

  android:
    name: android (aarch64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build (Docker, static android)
        run: |
          docker build \
            --build-arg ARIA2_REPO=${{ github.repository }} \
            --build-arg ARIA2_VERSION=${{ github.ref_name }} \
            -t aria2-android - < Dockerfile.android
          mkdir -p out
          docker run --rm -v "$PWD/out:/out" aria2-android \
            cp /root/build/aria2/src/aria2c /out

      - name: Package
        id: pkg
        run: |
          VERSION=$(sed -n 's/^AC_INIT(\[aria2\],\[\([^]]*\)\].*/\1/p' configure.ac)
          DIST="aria2-$VERSION-aarch64-linux-android-build1"
          mkdir -p "dist/$DIST"
          cp out/aria2c "dist/$DIST/"
          cp AUTHORS COPYING LICENSE.OpenSSL NEWS README.android "dist/$DIST/"
          (cd dist && zip -9 -r "$DIST.zip" "$DIST" && rm -rf "$DIST")
          echo "asset=dist/$DIST.zip" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.pkg.outputs.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: android-aarch64
          path: dist/*.zip

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes 2>/dev/null || true
          gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber

  macos:
    name: macos (arm64, static deps + AppleTLS)
    runs-on: macos-14  # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew install autoconf automake libtool pkg-config gettext m4
          echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix m4)/bin" >> "$GITHUB_PATH"

      - name: Build static dependencies (arm64)
        run: |
          set -euxo pipefail
          PREFIX="$PWD/deps-prefix"
          JOBS=$(sysctl -n hw.ncpu)
          mkdir -p "$PREFIX" src-deps && cd src-deps
          fetch() { curl -fL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 30 -o "$1" "$2"; }

          fetch zlib.tar.gz https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz
          tar xf zlib.tar.gz
          ( cd zlib-1.3.1 && ./configure --prefix="$PREFIX" --static && make -j"$JOBS" && make install )

          fetch expat.tar.bz2 https://github.com/libexpat/libexpat/releases/download/R_2_6_4/expat-2.6.4.tar.bz2
          tar xf expat.tar.bz2
          ( cd expat-2.6.4 && ./configure --prefix="$PREFIX" --enable-static --disable-shared \
              --without-docbook --without-examples --without-tests && make -j"$JOBS" && make install )

          fetch cares.tar.gz https://github.com/c-ares/c-ares/releases/download/v1.34.4/c-ares-1.34.4.tar.gz
          tar xf cares.tar.gz
          ( cd c-ares-1.34.4 && ./configure --prefix="$PREFIX" --enable-static --disable-shared && make -j"$JOBS" && make install )

          fetch sqlite.tar.gz https://www.sqlite.org/2024/sqlite-autoconf-3470200.tar.gz
          tar xf sqlite.tar.gz
          ( cd sqlite-autoconf-3470200 && ./configure --prefix="$PREFIX" --enable-static --disable-shared && make -j"$JOBS" && make install )

          fetch gmp.tar.xz https://gmplib.org/download/gmp/gmp-6.3.0.tar.xz
          tar xf gmp.tar.xz
          ( cd gmp-6.3.0 && ./configure --prefix="$PREFIX" --enable-static --disable-shared --with-pic && make -j"$JOBS" && make install )

          echo "DEPS_PREFIX=$PREFIX" >> "$GITHUB_ENV"

      - name: Build aria2 (static deps, AppleTLS)
        run: |
          set -euxo pipefail
          JOBS=$(sysctl -n hw.ncpu)
          autoreconf -i
          # deps-prefix holds only static .a archives, so aria2's dependencies link
          # statically; only macOS system libraries/frameworks remain dynamic (a
          # fully static binary is not possible on macOS).
          ./configure \
            --disable-shared --enable-static \
            --enable-bittorrent --enable-metalink --disable-nls \
            --with-appletls --with-libgmp --with-sqlite3 --with-libz \
            --with-libexpat --with-libcares \
            --without-libssh2 --without-gnutls --without-openssl \
            --without-libgcrypt --without-libnettle --without-libxml2 --without-libuv \
            CPPFLAGS="-I$DEPS_PREFIX/include" \
            LDFLAGS="-L$DEPS_PREFIX/lib" \
            PKG_CONFIG_PATH="$DEPS_PREFIX/lib/pkgconfig"
          make -C src -j"$JOBS" aria2c
          strip src/aria2c
          ./src/aria2c -v
          echo "-- linkage (only system dylibs expected) --"
          otool -L src/aria2c

      - name: Package
        id: pkg
        run: |
          VERSION=$(sed -n 's/^AC_INIT(\[aria2\],\[\([^]]*\)\].*/\1/p' configure.ac)
          DIST="aria2-$VERSION-macos-arm64-build1"
          mkdir -p "dist/$DIST"
          cp src/aria2c "dist/$DIST/"
          cp AUTHORS COPYING LICENSE.OpenSSL NEWS README.rst "dist/$DIST/"
          ( cd dist && tar czf "$DIST.tar.gz" "$DIST" && rm -rf "$DIST" )

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*.tar.gz'

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/*.tar.gz

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes 2>/dev/null || true
          gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz --clobber
